spring.application.name=NB69
server.port=${PORT:8080}
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.enabled=true
server.servlet.encoding.force=true
server.servlet.session.timeout=30d
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.secure=true
server.servlet.session.cookie.max-age=30d
spring.sql.init.mode=always
spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DATABASE_USERNAME}
spring.datasource.password=${DATABASE_PASSWORD}
nb69.bootstrap-code=${NB69_BOOTSTRAP_CODE:}

# Disabled until production SMS credentials and recipient numbers are configured.
nb69.sms.enabled=${NB69_SMS_ENABLED:false}
nb69.sms.account=${TWILIO_ACCOUNT_SID:}
nb69.sms.token=${TWILIO_AUTH_TOKEN:}
nb69.sms.from=${TWILIO_FROM:}
