spring.application.name=NB69
server.port=${PORT:8080}
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.enabled=true
server.servlet.encoding.force=true
server.servlet.session.timeout=30d
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.secure=true
server.servlet.session.cookie.max-age=30d
spring.sql.init.mode=always
spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DATABASE_USERNAME}
spring.datasource.password=${DATABASE_PASSWORD}
nb69.bootstrap-code=${NB69_BOOTSTRAP_CODE:}

# Disabled until Resend and a verified sender domain are configured.
nb69.email.enabled=${NB69_EMAIL_ENABLED:false}
nb69.email.token=${RESEND_API_KEY:}
nb69.email.from=${NB69_EMAIL_FROM:}

nb69.site-url=${NB69_SITE_URL:https://nb69.no}
